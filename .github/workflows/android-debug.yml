name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: build-src/mobile-app/package-lock.json

      - name: Extract project ZIP
        run: |
          mkdir -p build-src
          unzip -q ai-video-editor-v0.3-mobile-cloud-build.zip -d build-src

      - name: Check project
        working-directory: build-src/mobile-app
        run: |
          echo "Project files:"
          ls -la
          echo "Android directory:"
          ls -la android 2>/dev/null || true

      - name: Install Node dependencies
        working-directory: build-src/mobile-app
        run: |
          npm install

      - name: Prepare Android project
        working-directory: build-src/mobile-app
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Set Android minSdk to 24
        working-directory: build-src/mobile-app
        run: |
          echo "Before:"
          grep -R "minSdk" android/variables.gradle android/app/build.gradle 2>/dev/null || true

          if [ -f android/variables.gradle ]; then
            sed -i -E \
              's/minSdkVersion[[:space:]]*=[[:space:]]*23/minSdkVersion = 24/g' \
              android/variables.gradle

            sed -i -E \
              's/minSdkVersion[[:space:]]*=[[:space:]]*23/minSdkVersion = 24/g' \
              android/gradle.properties
          fi

          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 | \
            xargs -0 sed -i -E \
              's/minSdkVersion[[:space:]]+23/minSdkVersion 24/g'

          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 | \
            xargs -0 sed -i -E \
              's/minSdk[[:space:]]+23/minSdk 24/g'

          echo "After:"
          grep -R "minSdk" android/variables.gradle android/app/build.gradle 2>/dev/null || true

      - name: Apply native runtime
        working-directory: build-src/mobile-app
        run: |
          bash scripts/apply-native-runtime.sh

      - name: Verify FFmpegKit dependency
        working-directory: build-src/mobile-app
        run: |
          grep -R "ffmpeg-kit" android/app/build.gradle android 2>/dev/null || true
          grep -R "minSdk" android/variables.gradle android/app/build.gradle 2>/dev/null || true

      - name: Make Gradle executable
        working-directory: build-src/mobile-app/android
        run: |
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: build-src/mobile-app/android
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-editor-debug-apk
          path: build-src/mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
