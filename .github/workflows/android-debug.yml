name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract project ZIP
        run: |
          mkdir -p build-src
          unzip -q ai-video-editor-v0.3-mobile-cloud-build.zip -d build-src

      - name: Prepare Android project
        working-directory: build-src/mobile-app
        run: |
          npm install
          if [ ! -d android ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      -      - name: Set Android minSdk to 24
        working-directory: build-src/mobile-app
        run: |
          sed -i -E 's/minSdkVersion[[:space:]]*=[[:space:]]*23/minSdkVersion = 24/g' android/variables.gradle
          find android -type f -name "*.gradle" -print0 | xargs -0 sed -i -E 's/minSdkVersion[[:space:]]+23/minSdkVersion 24/g'
          find android -type f -name "*.gradle" -print0 | xargs -0 sed -i -E 's/minSdk[[:space:]]+23/minSdk 24/g'

      - name: Apply native runtime
        working-directory: build-src/mobile-app
        run: bash scripts/apply-native-runtime.sh

      - name: Build Debug APK
        working-directory: build-src/mobile-app/android
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-editor-debug-apk
          path: build-src/mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
